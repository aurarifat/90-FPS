name: Build & Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release with APK & Source Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          chmod +x ./gradlew || true
          if [ ! -f "releases/90FPSBooster-v1.1.0.apk" ]; then
            gradle assembleDebug
            mkdir -p releases
            cp $(find . -name "*debug.apk" | head -n 1) releases/90FPSBooster-v1.1.0.apk
          fi
          cd releases
          sha256sum 90FPSBooster-v1.1.0.apk > 90FPSBooster-v1.1.0.apk.sha256
          ls -lh

      - name: Package Source Code Archive
        run: |
          zip -r releases/90FPSBooster-v1.1.0-source-code.zip . -x ".git/*" ".gradle/*" "build/*" "app/build/*" ".build-outputs/*"
          ls -lh releases/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.version_tag || 'v1.1.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "90 FPS BOOSTER ${{ steps.release_info.outputs.tag }} (Stable Release)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            releases/90FPSBooster-v1.1.0.apk
            releases/90FPSBooster-v1.1.0.apk.sha256
            releases/90FPSBooster-v1.1.0-source-code.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
